name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  build-linux:
    needs: test
    strategy:
      matrix:
        include:
          - arch: x64
            os: ubuntu-latest
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Optimize System
        run: |
          sudo apt-get update -yq
          sudo apt-get install -yq snapd

      - name: Install Snapcraft 9
        run: |
          sudo snap wait system seed.loaded
          for i in {1..3}; do
            sudo snap install snapcraft --classic --channel=9.x/stable && break || sleep 15
          done

      - name: Configure Snapcraft compatibility
        run: |
          sudo install -m 0755 scripts/snapcraft-compat.sh /usr/local/bin/snapcraft
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          export PATH="/usr/local/bin:$PATH"
          command -v snapcraft

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate application
        run: |
          pnpm run typecheck
          pnpm run lint
          pnpm run build
          pnpm audit --audit-level high

      - name: Build Snap and DEB (${{ matrix.arch }})
        run: |
          command -v snapcraft
          pnpm exec electron-builder --linux dir --${{ matrix.arch }} --publish never
          pnpm exec electron-builder --linux deb --${{ matrix.arch }} --publish never
          bash scripts/build-snap.sh ${{ matrix.arch }}
        env:
          SNAPCRAFT_BUILD_ENVIRONMENT: host
          SNAPCRAFT_HAS_CASCADING_RELEASE: 'false'
          USE_SNAPCRAFT_DESTRUCTIVE_MODE: 'true'

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-${{ matrix.arch }}
          path: |
            release/*.deb
            release/*.snap
          if-no-files-found: error

  build-windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate application
        run: |
          pnpm run typecheck
          pnpm run lint
          pnpm run build
          pnpm audit --audit-level high

      - name: Build Windows installer
        run: pnpm exec electron-builder --win nsis --x64 --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-x64
          path: release/*.exe
          if-no-files-found: error

  build-macos:
    needs: test
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate application
        run: |
          pnpm run typecheck
          pnpm run lint
          pnpm run build
          pnpm audit --audit-level high

      - name: Build macOS installers
        run: pnpm exec electron-builder --mac dmg --x64 --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: release/*.dmg
          if-no-files-found: error

  publish:
    needs:
      - test
      - build-linux
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Validate release artifacts
        run: |
          test "$(find release -maxdepth 1 -type f -name '*.snap' | wc -l)" -eq 2
          test "$(find release -maxdepth 1 -type f -name '*.deb' | wc -l)" -eq 2
          test "$(find release -maxdepth 1 -type f -name '*.exe' | wc -l)" -eq 1
          test "$(find release -maxdepth 1 -type f -name '*.dmg' | wc -l)" -eq 2

      - name: Extract Release Notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ -f CHANGELOG.md ]; then
            awk "/^## \[$VERSION\]/{p=1; next} /^## \[/{p=0} p" CHANGELOG.md > release_notes.md
          fi
          if [ ! -s release_notes.md ]; then
            echo "Release ${GITHUB_REF_NAME}" > release_notes.md
          fi
          cat release_notes.md

      - name: Install Snapcraft 9
        run: |
          sudo apt-get update -yq
          sudo apt-get install -yq snapd
          sudo snap wait system seed.loaded
          for i in {1..3}; do
            sudo snap install snapcraft --classic --channel=9.x/stable && break || sleep 15
          done

      - name: Configure Snapcraft compatibility
        run: |
          sudo install -m 0755 scripts/snapcraft-compat.sh /usr/local/bin/snapcraft
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          export PATH="/usr/local/bin:$PATH"
          command -v snapcraft

      - name: Upload Snap packages
        run: |
          cd release
          for snap in *.snap; do
            snapcraft upload "$snap" --release=stable
          done
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}

      - name: Create/Update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release_notes.md
          fail_on_unmatched_files: true
          files: |
            release/*.deb
            release/*.snap
            release/*.exe
            release/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
