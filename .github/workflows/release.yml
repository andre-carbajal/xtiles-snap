name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  build-linux:
    needs: test
    strategy:
      matrix:
        include:
          - arch: x64
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - arch: arm64
            target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            libssl-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config \
            rpm \
            snapd \
            xdg-utils

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.27.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri

      - name: Install Snapcraft 9
        run: |
          sudo snap wait system seed.loaded
          for i in {1..3}; do
            sudo snap install snapcraft --classic --channel=9.x/stable && break || sleep 15
          done
          command -v snapcraft

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate application
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          pnpm run typecheck
          pnpm run lint
          pnpm audit --audit-level high

      - name: Build Linux bundles
        run: |
          pnpm tauri build --bundles appimage,deb,rpm --target "${{ matrix.target }}" --ci
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
          test -d "$BUNDLE_DIR"
          mkdir -p release
          for directory in appimage deb rpm; do
            for file in "$BUNDLE_DIR/$directory"/*; do
              [ -f "$file" ] || continue
              name="$(basename "$file")"
              extension="${name##*.}"
              stem="${name%.*}"
              cp "$file" "release/${stem}-${{ matrix.arch }}.${extension}"
            done
          done
          bash scripts/build-snap.sh "${{ matrix.arch }}" "$BUNDLE_DIR"
        env:
          SNAPCRAFT_BUILD_ENVIRONMENT: host
          SNAPCRAFT_HAS_CASCADING_RELEASE: 'false'
          USE_SNAPCRAFT_DESTRUCTIVE_MODE: 'true'

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error

  build-windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.27.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate application
        run: |
          pnpm run typecheck
          pnpm run lint
          pnpm audit --audit-level high

      - name: Build Windows installer
        run: |
          pnpm tauri build --bundles nsis --target x86_64-pc-windows-msvc --ci --no-sign
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe release/

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-x64
          path: release/*.exe
          if-no-files-found: error

  build-macos:
    needs: test
    strategy:
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
            os: macos-14
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.27.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate application
        run: |
          pnpm run typecheck
          pnpm run lint
          pnpm audit --audit-level high

      - name: Build macOS installer
        run: |
          pnpm tauri build --bundles dmg --target "${{ matrix.target }}" --ci --no-sign
          mkdir -p release
          for file in src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg; do
            name="$(basename "$file")"
            extension="${name##*.}"
            stem="${name%.*}"
            cp "$file" "release/${stem}-${{ matrix.arch }}.${extension}"
          done

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-${{ matrix.arch }}
          path: release/*.dmg
          if-no-files-found: error

  publish:
    needs:
      - test
      - build-linux
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Validate release artifacts
        run: |
          test "$(find release -maxdepth 1 -type f -name '*.AppImage' | wc -l)" -eq 2
          test "$(find release -maxdepth 1 -type f -name '*.deb' | wc -l)" -eq 2
          test "$(find release -maxdepth 1 -type f -name '*.rpm' | wc -l)" -eq 2
          test "$(find release -maxdepth 1 -type f -name '*.snap' | wc -l)" -eq 2
          test "$(find release -maxdepth 1 -type f -name '*.exe' | wc -l)" -eq 1
          test "$(find release -maxdepth 1 -type f -name '*.dmg' | wc -l)" -eq 1

      - name: Extract release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ -f CHANGELOG.md ]; then
            awk "/^## \[$VERSION\]/{p=1; next} /^## \[/{p=0} p" CHANGELOG.md > release_notes.md
          fi
          if [ ! -s release_notes.md ]; then
            echo "Release ${GITHUB_REF_NAME}" > release_notes.md
          fi

      - name: Install Snapcraft 9
        run: |
          sudo apt-get update
          sudo apt-get install -y snapd
          sudo snap wait system seed.loaded
          for i in {1..3}; do
            sudo snap install snapcraft --classic --channel=9.x/stable && break || sleep 15
          done
          command -v snapcraft

      - name: Upload Snap packages
        run: |
          for snap in release/*.snap; do
            snapcraft upload "$snap" --release=stable
          done
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release_notes.md
          fail_on_unmatched_files: true
          files: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.snap
            release/*.exe
            release/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
