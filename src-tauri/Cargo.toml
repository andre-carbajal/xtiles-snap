[package]
name = "xtiles-snap"
version = "2.0.0"
description = "xTiles desktop application powered by Tauri"
authors = ["Andre Carbajal Vargas <carbajalvargasandre@gmail.com>"]
edition = "2021"
license = "ISC"
repository = "https://github.com/andre-carbajal/xtiles-snap"
build = "build.rs"

[lib]
name = "xtiles_snap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-opener = "2.5.5"
url = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
