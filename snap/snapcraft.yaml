name: xtiles-snap
base: core24
version: "__VERSION__"
summary: xTiles desktop application
description: |
  Unofficial xTiles desktop application for Linux.

grade: stable
confinement: strict
icon: snap/gui/icon.png

platforms:
  __ARCH__:
    build-on: __ARCH__
    build-for: __ARCH__

apps:
  xtiles-snap:
    command: usr/bin/xtiles-snap
    desktop: usr/share/applications/xtiles-snap.desktop
    plugs:
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - browser-support
      - network
      - opengl
      - home
      - removable-media

parts:
  xtiles-snap:
    plugin: dump
    source: app
    stage-packages:
      - libwebkit2gtk-4.1-0
      - libjavascriptcoregtk-4.1-0
      - libgtk-3-0
      - libglib2.0-0
      - libnss3
      - libx11-6
      - libxcomposite1
      - libxdamage1
      - libxrandr2
      - libxss1
      - libasound2
      - libatk-bridge2.0-0
      - libatspi2.0-0
      - libdrm2
      - libgbm1
      - libwayland-client0
      - xdg-utils
